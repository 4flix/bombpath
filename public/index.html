<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>CarRoyale</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="menu" class="screen">
    <div class="menu-card">
      <h1>🚗 CarRoyale</h1>
      <p class="tagline">10명이 낙하 → 자동차를 선점하고 → 자기장을 피해 마지막까지 살아남으세요</p>
      <input id="nameInput" type="text" placeholder="닉네임" maxlength="12" />
      <button id="btnJoin">빠른 시작</button>
      <p id="menuMsg" class="msg"></p>
    </div>
  </div>

  <div id="lobby" class="screen hidden">
    <div class="menu-card">
      <h2>대기실</h2>
      <p><span id="lobbyCount">0</span> / <span id="lobbyMax">10</span> 명</p>
      <p>시작까지 <span id="lobbyTimer">60</span>초</p>
      <ul id="lobbyList"></ul>
    </div>
  </div>

  <div id="game" class="screen hidden">
    <canvas id="canvas"></canvas>

    <div id="hud">
      <div id="hpBarWrap"><div id="hpBar"></div><span id="hpText"></span></div>
      <div id="statusText"></div>
    </div>

    <div id="feed"></div>

    <div id="dropOverlay" class="overlay hidden">
      <div class="drop-text">낙하 중...</div>
    </div>

    <div id="minimapWrap"><canvas id="minimap" width="140" height="140"></canvas></div>

    <div id="joystickBase">
      <div id="joystickKnob"></div>
    </div>
  </div>

  <div id="result" class="screen hidden">
    <div class="menu-card">
      <h2 id="resultTitle"></h2>
      <ol id="standingsList"></ol>
      <button id="btnBackToMenu">다시 하기</button>
    </div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="game.js"></script>
</body>
</html>
